name: اجرای عامل متصل به ChatGPT

on:
  workflow_dispatch:
    inputs:
      task:
        description: "دستور کامل کاربر برای Agent"
        required: true
        type: string
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-متصل-به-ChatGPT
  cancel-in-progress: false

jobs:
  # این Job کاملاً مستقل از ChatGPT است و هر زمان سایت در site/ وجود داشته باشد آن را Deploy می‌کند.
  deploy:
    name: 🚀 Deploy مستقیم سایت
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6

      - name: بررسی سایت
        shell: bash
        run: |
          set -e
          test -f site/index.html
          echo "site/index.html پیدا شد."

      - name: آماده‌سازی GitHub Pages
        uses: actions/configure-pages@v5

      - name: بسته‌بندی سایت برای Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: انتشار سایت
        id: deployment
        uses: actions/deploy-pages@v4

      - name: نمایش آدرس سایت
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "سایت با موفقیت Deploy شد:"
          echo "$SITE_URL"

  # این Job فقط برای ساخت و ویرایش سایت توسط ChatGPT است.
  executor:
    name: 🤖 Agent + ChatGPT
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: دریافت دستور کاربر
        id: task
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TASK="$WORKFLOW_TASK"
          else
            TASK="$ISSUE_BODY"
            if [ -z "$TASK" ]; then
              TASK="$ISSUE_TITLE"
              TASK="${TASK#\[Agent\] }"
            fi
          fi
          if [ -z "$(printf '%s' "$TASK" | tr -d '[:space:]')" ]; then
            echo "دستور کاربر خالی است." >&2
            exit 1
          fi
          {
            echo "task<<EOF"
            printf '%s\n' "$TASK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "دستور دریافت شد:"
          printf '%s\n' "$TASK"

      - name: تولید Plan واقعی با ChatGPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AGENT_TASK: ${{ steps.task.outputs.task }}
        shell: bash
        run: |
          set -e
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Secret با نام OPENAI_API_KEY پیدا نشد." >&2
            exit 1
          fi
          python agent/planner.py

      - name: اجرای Executor
        run: python agent/executor.py

      - name: ثبت تغییرات
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "تغییری برای ثبت وجود ندارد."
            exit 0
          fi
          git commit -m "🤖 اجرای دستور تولیدشده توسط ChatGPT"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: اعتبارسنجی و ساخت ZIP
        if: always() && hashFiles('site/**') != ''
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('site')
          if not (root / 'index.html').is_file():
              raise SystemExit('index.html وجود ندارد.')
          for p in root.rglob('*.zip'):
              p.unlink()
          out = Path('site.zip')
          if out.exists(): out.unlink()
          with ZipFile(out, 'w', ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(root).as_posix())
          with ZipFile(out) as z:
              names = z.namelist()
              if 'index.html' not in names:
                  raise SystemExit('index.html داخل ZIP نیست.')
              if any(n.lower().endswith('.zip') for n in names):
                  raise SystemExit('ZIP تو در تو شناسایی شد.')
              if z.testzip() is not None:
                  raise SystemExit('ZIP خراب است.')
          print('ZIP سالم و بدون ZIP تو در تو است.')

      - name: تحویل فایل‌های واقعی سایت
        if: always() && hashFiles('site/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: خروجی-واقعی-سایت
          path: site/
          if-no-files-found: error
          retention-days: 7

      - name: تحویل ZIP واقعی سایت
        if: always() && hashFiles('site.zip') != ''
        uses: actions/upload-artifact@v5
        with:
          name: ZIP-واقعی-سایت
          path: site.zip
          if-no-files-found: error
          retention-days: 7

      - name: گزارش اجرا
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-Agent
          path: |
            agent-result.json
            agent-result.txt
            chatgpt_plan.json
          if-no-files-found: ignore
          retention-days: 7

      - name: گزارش نتیجه در Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Agent اجرا شد. خروجی سایت و ZIP در Artifacts قرار گرفت و Deploy توسط Job مستقل انجام می‌شود."
