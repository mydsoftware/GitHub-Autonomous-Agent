name: اجرای عامل متصل به ChatGPT

on:
  workflow_dispatch:
    inputs:
      دستور:
        description: "دستور کامل کاربر برای Agent؛ مثال: یک سایت حرفه‌ای فارسی درباره ماهواره مرکزی بساز"
        required: true
        type: string
      اجرا:
        description: "اجرای Plan تولیدشده توسط ChatGPT"
        required: false
        type: boolean
        default: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-متصل-به-ChatGPT
  cancel-in-progress: false

jobs:
  executor:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Agent]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: دریافت دستور واقعی کاربر
        id: task
        env:
          DISPATCH_TASK: ${{ inputs.دستور }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TASK="$DISPATCH_TASK"
          else
            TASK="$ISSUE_BODY"
            if [ -z "$TASK" ]; then
              TASK="$ISSUE_TITLE"
              TASK="${TASK#\[Agent\] }"
            fi
          fi
          if [ -z "$(printf '%s' "$TASK" | tr -d '[:space:]')" ]; then
            echo "دستور خالی است." >&2
            exit 1
          fi
          {
            echo 'task<<EOF'
            printf '%s\n' "$TASK"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "دستور دریافت شد:"
          printf '%s\n' "$TASK"

      - name: تولید Plan واقعی با ChatGPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AGENT_TASK: ${{ steps.task.outputs.task }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Secret به نام OPENAI_API_KEY پیدا نشد." >&2
            exit 1
          fi
          python agent/planner.py

      - name: اجرای برنامه تولیدشده توسط ChatGPT
        run: python agent/executor.py

      - name: ثبت تغییرات
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "🤖 اجرای دستور تولیدشده توسط ChatGPT"
          git push

      - name: اعتبارسنجی و آماده‌سازی خروجی سایت
        if: success() && hashFiles('site/**') != ''
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("site")
          files = [p for p in root.rglob("*") if p.is_file()]
          if not files:
              raise SystemExit("پوشه site خالی است")
          if not (root / "index.html").is_file():
              raise SystemExit("index.html وجود ندارد")
          out = Path("site.zip")
          with ZipFile(out, "w", ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, p.relative_to(root).as_posix())
          with ZipFile(out, "r") as z:
              names = z.namelist()
              if any(Path(n).name == "site.zip" or n.endswith(".zip") for n in names):
                  raise SystemExit("ZIP تو در تو شناسایی شد")
              if "index.html" not in names:
                  raise SystemExit("index.html در ZIP وجود ندارد")
              if z.testzip() is not None:
                  raise SystemExit("ZIP خراب است")
          print("ZIP واقعی سایت معتبر است")
          print("\n".join(names))
          PY

      - name: تحویل خروجی سایت به‌صورت فایل‌های واقعی
        if: always() && hashFiles('site/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: خروجی-سایت-نهایی
          path: site/
          if-no-files-found: error

      - name: آماده‌سازی انتشار GitHub Pages
        if: success() && hashFiles('site/**') != ''
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: بسته‌بندی برای GitHub Pages
        if: success() && hashFiles('site/**') != ''
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site

      - name: انتشار سایت در GitHub Pages
        if: success() && hashFiles('site/**') != ''
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: ثبت نتیجه انتشار
        if: always() && hashFiles('site/**') != ''
        run: |
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "لینک سایت: ${{ steps.deployment.outputs.page_url }}" >> agent-result.txt
          else
            echo "GitHub Pages در دسترس نبود؛ خروجی سایت در Artifact قرار گرفت." >> agent-result.txt
          fi

      - name: بارگذاری گزارش
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-ChatGPT
          path: |
            agent-result.json
            agent-result.txt
          if-no-files-found: ignore

      - name: گزارش نتیجه در Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -f agent-result.json ]; then
            {
              echo "## نتیجه اجرای ChatGPT"
              echo
              cat agent-result.json
              echo
              if [ -n "$SITE_URL" ]; then
                echo "### لینک خروجی سایت"
                echo "$SITE_URL"
              else
                echo "### خروجی"
                echo "GitHub Pages در دسترس نبود؛ خروجی سایت در Artifact قرار گرفته است."
              fi
            } > agent-comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file agent-comment.md
          fi
