name: اجرای عامل متصل به ChatGPT

on:
  workflow_dispatch:
    inputs:
      task:
        description: "دستور کامل کاربر برای Agent"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-متصل-به-ChatGPT
  cancel-in-progress: false

jobs:
  executor:
    name: 🤖 Agent + ChatGPT + AI-Agent-Manager Security
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: دریافت AI-Agent-Manager
        shell: bash
        run: git clone --depth 1 --branch feat/security-pentest-loop https://github.com/mydsoftware/AI-Agent-Manager.git ai-agent-manager
      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: دریافت دستور کاربر
        id: task
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TASK="$WORKFLOW_TASK"; else TASK="$ISSUE_BODY"; if [ -z "$TASK" ]; then TASK="$ISSUE_TITLE"; TASK="${TASK#\[Agent\] }"; fi; fi
          if [ -z "$(printf '%s' "$TASK" | tr -d '[:space:]')" ]; then exit 1; fi
          { echo "task<<EOF"; printf '%s\n' "$TASK"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: اجرای حلقه Build → Test → Security → Fix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AGENT_TASK: ${{ steps.task.outputs.task }}
          AI_MANAGER_ROOT: ${{ github.workspace }}/ai-agent-manager
        shell: bash
        run: |
          set -u
          FEEDBACK=""
          MAX_ROUNDS=8
          SUCCESS=0
          for ROUND in $(seq 1 $MAX_ROUNDS); do
            echo "=== چرخه خودمختار $ROUND/$MAX_ROUNDS ==="
            export AGENT_FEEDBACK="$FEEDBACK"
            if ! python agent/planner.py; then FEEDBACK="Planner شکست خورد؛ Plan را اصلاح کن."; continue; fi
            if ! python agent/executor.py; then FEEDBACK="$(cat agent-result.json 2>/dev/null || echo Executor شکست خورد.)"; continue; fi
            if python agent/security_gate.py; then SUCCESS=1; break; fi
            FEEDBACK="$(cat security-result.json 2>/dev/null || echo Security Gate شکست خورد.)"
            echo "Security Finding شناسایی شد؛ چرخه بعدی برای اصلاح اجرا می‌شود."
          done
          if [ "$SUCCESS" -ne 1 ]; then echo "Security Gate پس از $MAX_ROUNDS چرخه Pass نشد." >&2; exit 1; fi
      - name: ثبت تغییرات
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🤖 اجرای دستور ChatGPT + Security Gate"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: اعتبارسنجی و ساخت ZIP
        if: always() && hashFiles('site/**') != ''
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('site')
          if not (root/'index.html').is_file(): raise SystemExit('index.html وجود ندارد.')
          out=Path('site.zip')
          if out.exists(): out.unlink()
          with ZipFile(out,'w',ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(root).as_posix())
          with ZipFile(out) as z:
              if 'index.html' not in z.namelist(): raise SystemExit('index.html داخل ZIP نیست.')
              if z.testzip() is not None: raise SystemExit('ZIP خراب است.')
      - name: تحویل فایل‌های واقعی سایت
        if: always() && hashFiles('site/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: خروجی-واقعی-سایت
          path: site/
          if-no-files-found: error
          retention-days: 7
      - name: تحویل ZIP واقعی سایت
        if: always() && hashFiles('site.zip') != ''
        uses: actions/upload-artifact@v5
        with:
          name: ZIP-واقعی-سایت
          path: site.zip
          if-no-files-found: error
          retention-days: 7
      - name: گزارش اجرا
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-Agent
          path: |
            agent-result.json
            chatgpt_plan.json
            security-result.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: 🚀 Deploy پس از Security Gate
    needs: executor
    if: needs.executor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت نسخه تأییدشده
        uses: actions/checkout@v6
      - name: بررسی سایت
        shell: bash
        run: test -f site/index.html
      - name: آماده‌سازی GitHub Pages
        uses: actions/configure-pages@v5
      - name: بسته‌بندی سایت برای Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: انتشار سایت
        id: deployment
        uses: actions/deploy-pages@v4
      - name: نمایش آدرس سایت
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "$SITE_URL"
