name: اجرای عامل متصل به ChatGPT

on:
  push:
    paths:
      - "chat_requests/*.json"
  repository_dispatch:
    types: [ai-agent-project]
  workflow_dispatch:
    inputs:
      task:
        description: "Plan JSON تولیدشده توسط ChatGPT"
        required: true
        type: string
  issues:
    types: [opened]
  pull_request:
    paths:
      - "agent/**"
      - "security_check.py"
      - ".github/workflows/agent.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-متصل-به-ChatGPT-${{ github.event.client_payload.target_repository || github.repository }}
  cancel-in-progress: false

jobs:
  integration:
    name: 🧪 آزمون بررسی امنیتی فارسی
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: آزمون امنیتی واقعی
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          printf '%s\n' '<script>eval("x")</script>' > site/index.html
          if python security_check.py; then
            echo "بررسی امنیتی باید Finding سطح بالا را مسدود کند." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          data=json.load(open('security-result.json', encoding='utf-8'))
          assert data['status'] == 'failed'
          assert any(f['severity'] == 'high' for f in data['findings'])
          print('آزمون امنیتی موفق بود.')
          PY

  executor:
    name: 🤖 اجرای Plan فارسی و Security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: دریافت مخزن Agent
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: تعیین Repository مقصد
        id: target
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository }}
          TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            test -n "$TARGET_REPOSITORY" || { echo "target_repository در Dispatch وجود ندارد." >&2; exit 1; }
            BRANCH="${TARGET_BRANCH:-main}"
          else
            BRANCH="${GITHUB_REF_NAME}"
            TARGET_REPOSITORY="$GITHUB_REPOSITORY"
          fi
          echo "workspace=${GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
          echo "repository=$TARGET_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: ثبت وضعیت شروع اجرا
        if: github.event_name == 'repository_dispatch'
        env:
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          RUN_ID: ${{ github.run_id }}
          PLAN_SUMMARY: ${{ github.event.client_payload.plan.summary }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          state = {
              "status": "running",
              "phase": "build-test-security",
              "repository": os.environ["TARGET_REPOSITORY"],
              "branch": os.environ["TARGET_BRANCH"],
              "agent_run_id": os.environ["RUN_ID"],
              "summary": os.environ.get("PLAN_SUMMARY", ""),
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          os.makedirs("agent", exist_ok=True)
          with open("agent/execution-state.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/execution-state.json
          git commit -m "شروع اجرای مستقل عامل"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: دریافت Plan از ChatGPT
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TASK="$WORKFLOW_TASK"
            printf '%s\n' "$TASK" > agent/chatgpt_plan.json
          elif [ "$EVENT_NAME" = "issues" ]; then
            printf '%s\n' "$ISSUE_BODY" > agent/chatgpt_plan.json
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python - <<'PY'
          import json, os
          payload = json.loads(os.environ["DISPATCH_PAYLOAD"])
          plan = payload.get("plan")
          if not isinstance(plan, dict):
              raise SystemExit("Dispatch باید plan JSON داشته باشد.")
          if not isinstance(plan.get("files"), list) or not isinstance(plan.get("commands"), list) or plan.get("done") is not True:
              raise SystemExit("Plan باید شامل files و commands و done=true باشد.")
          with open("agent/chatgpt_plan.json", "w", encoding="utf-8") as f:
              json.dump(plan, f, ensure_ascii=False, indent=2)
          print(json.dumps({"summary": plan.get("summary", ""), "files": len(plan.get("files", [])), "commands": len(plan.get("commands", []))}, ensure_ascii=False))
          PY
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^chat_requests/.*\.json$' | tail -n 1 || true)
            test -n "$REQUEST_FILE" || REQUEST_FILE=$(find chat_requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)
            test -n "$REQUEST_FILE"
            cp "$REQUEST_FILE" agent/chatgpt_plan.json
          fi
          test -s agent/chatgpt_plan.json

      - name: اجرای ساخت، تست و امنیت
        env:
          AGENT_PLAN: ${{ github.workspace }}/agent/chatgpt_plan.json
          AGENT_WORKSPACE: ${{ steps.target.outputs.workspace }}
          AGENT_RESULT: ${{ github.workspace }}/agent-result.json
        shell: bash
        run: |
          set -euo pipefail
          python agent/planner.py
          python agent/executor.py
          python security_check.py

      - name: ثبت نتیجه
        if: always()
        shell: bash
        run: |
          mkdir -p agent-results
          cp -f agent-result.json agent-results/agent-result.json 2>/dev/null || true
          cp -f agent/chatgpt_plan.json agent-results/chatgpt_plan.json 2>/dev/null || true
          cp -f security-result.json agent-results/security-result.json 2>/dev/null || true

      - name: ثبت تغییرات Repository مقصد
        if: success() && github.event_name == 'repository_dispatch'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "تغییری برای ثبت وجود ندارد."
            exit 0
          fi
          git commit -m "ساخت پروژه با عامل خودکار"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: ثبت وضعیت نهایی اجرا
        if: always() && github.event_name == 'repository_dispatch'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          RUN_ID: ${{ github.run_id }}
          FINAL_STATUS: ${{ job.status == 'success' && 'completed' || 'failed' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          status = os.environ["FINAL_STATUS"]
          state = {
              "status": status,
              "phase": "completed" if status == "completed" else "failed",
              "repository": os.environ["TARGET_REPOSITORY"],
              "branch": os.environ["TARGET_BRANCH"],
              "agent_run_id": os.environ["RUN_ID"],
              "finished_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("agent/execution-state.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/execution-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ثبت وضعیت نهایی اجرای عامل"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: گزارش اجرا
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-Agent-${{ github.run_number }}
          path: agent-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: 🚀 انتشار پس از موفقیت
    needs: executor
    if: needs.executor.result == 'success' && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: دریافت نسخه تأییدشده
        uses: actions/checkout@v6
      - name: بررسی سایت
        run: test -f site/index.html
      - name: آماده‌سازی GitHub Pages
        uses: actions/configure-pages@v5
      - name: بسته‌بندی سایت
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: انتشار سایت
        id: deployment
        uses: actions/deploy-pages@v4
      - name: نمایش آدرس سایت
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "$SITE_URL"
