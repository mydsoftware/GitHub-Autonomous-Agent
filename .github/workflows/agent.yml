name: اجرای عامل خودمختار

on:
  workflow_dispatch:
    inputs:
      task:
        description: "دستور فارسی برای عامل"
        required: true
        type: string
  repository_dispatch:
    types: [agent_task]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-خودمختار
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Agent]'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt

      - name: تعیین دستور
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
          DISPATCH_TASK: ${{ github.event.client_payload.task }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -n "$WORKFLOW_TASK" ]; then
            printf '%s' "$WORKFLOW_TASK" > agent-task.txt
          elif [ -n "$DISPATCH_TASK" ]; then
            printf '%s' "$DISPATCH_TASK" > agent-task.txt
          else
            {
              printf '%s\n\n' "$ISSUE_TITLE"
              printf '%s' "$ISSUE_BODY"
            } > agent-task.txt
          fi

      - name: اجرای حلقه مهندسی
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_ITERATIONS: "8"
          AI_MODEL: "gpt-5.6"
        run: |
          export AGENT_TASK="$(cat agent-task.txt)"
          python agent/runner.py

      - name: ثبت تغییرات
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "🤖 اجرای خودکار عامل"
          git push

      - name: آماده‌سازی انتشار سایت
        if: success() && hashFiles('site/**') != ''
        uses: actions/configure-pages@v5

      - name: بسته‌بندی سایت
        if: success() && hashFiles('site/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: انتشار سایت
        if: success() && hashFiles('site/**') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: بارگذاری گزارش
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-عامل
          path: agent-result.json
          if-no-files-found: ignore

      - name: گزارش نتیجه در Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -f agent-result.json ]; then
            {
              echo "## نتیجه اجرای عامل"
              echo
              cat agent-result.json
              if [ -n "$SITE_URL" ]; then
                echo
                echo "### لینک خروجی سایت"
                echo "$SITE_URL"
              fi
            } > agent-comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file agent-comment.md
          fi
