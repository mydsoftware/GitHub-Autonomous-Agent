name: اجرای عامل خودمختار

on:
  workflow_dispatch:
    inputs:
      task:
        description: "دستور فارسی برای عامل"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt

      - name: تعیین دستور
        id: task
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
          ISSUE_TASK: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -n "$WORKFLOW_TASK" ]; then
            printf '%s' "$WORKFLOW_TASK" > agent-task.txt
          else
            {
              printf '%s\n\n' "$ISSUE_TASK"
              printf '%s' "$ISSUE_BODY"
            } > agent-task.txt
          fi

      - name: اجرای حلقه مهندسی
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_TASK: ${{ inputs.task }}
          MAX_ITERATIONS: "8"
          AI_MODEL: "gpt-5.6"
        run: |
          if [ -z "$AGENT_TASK" ]; then
            export AGENT_TASK="$(cat agent-task.txt)"
          fi
          python agent/runner.py

      - name: ثبت تغییرات
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "🤖 اجرای خودکار عامل"
          git push

      - name: بارگذاری گزارش
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-عامل
          path: agent-result.json
          if-no-files-found: ignore

      - name: گزارش نتیجه در Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f agent-result.json ]; then
            gh issue comment "$ISSUE_NUMBER" --body "## نتیجه اجرای عامل\n\n\`\`\`json\n$(cat agent-result.json)\n\`\`\`"
          fi
