name: اجرای عامل متصل به ChatGPT

on:
  workflow_dispatch:
    inputs:
      اجرا:
        description: "اجرای برنامه‌ای که ChatGPT در chatgpt_plan.json قرار داده است"
        required: true
        type: boolean
        default: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-متصل-به-ChatGPT
  cancel-in-progress: false

jobs:
  executor:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Agent]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: اجرای برنامه تولیدشده توسط ChatGPT
        run: python agent/executor.py

      - name: ثبت تغییرات
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "🤖 اجرای تغییرات تولیدشده توسط ChatGPT"
          git push

      - name: آماده‌سازی انتشار سایت
        if: success() && hashFiles('site/**') != ''
        uses: actions/configure-pages@v5

      - name: بسته‌بندی سایت
        if: success() && hashFiles('site/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: انتشار سایت
        if: success() && hashFiles('site/**') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: بارگذاری گزارش
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-ChatGPT
          path: agent-result.json
          if-no-files-found: ignore

      - name: گزارش نتیجه در Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -f agent-result.json ]; then
            {
              echo "## نتیجه اجرای ChatGPT"
              echo
              cat agent-result.json
              if [ -n "$SITE_URL" ]; then
                echo
                echo "### لینک خروجی سایت"
                echo "$SITE_URL"
              fi
            } > agent-comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file agent-comment.md
          fi
