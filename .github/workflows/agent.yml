name: اجرای عامل متصل به ChatGPT

on:
  push:
    paths:
      - "chat_requests/*.json"
  repository_dispatch:
    types: [ai-agent-project]
  workflow_dispatch:
    inputs:
      task:
        description: "Plan JSON تولیدشده توسط ChatGPT"
        required: true
        type: string
  issues:
    types: [opened]
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-متصل-به-ChatGPT-${{ github.event.client_payload.target_repository || github.repository }}
  cancel-in-progress: false

jobs:
  integration:
    name: 🧪 تست اتصال Security Agent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: دریافت نسخه پایدار Security Agent
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch security-agent-release "https://github.com/mydsoftware/AI-Agent-Manager.git" ai-agent-manager
      - name: بررسی Security bridge
        run: python -m py_compile ai-agent-manager/manager_security.py
      - name: آزمون واقعی SecurityAgent
        env:
          AI_MANAGER_ROOT: ${{ github.workspace }}/ai-agent-manager
        run: |
          mkdir -p site
          printf '%s\n' '<script>eval("x")</script>' > site/index.html
          if python ai-agent-manager/manager_security.py; then echo "SecurityAgent باید Finding را Block کند." >&2; exit 1; fi
          python - <<'PY'
          import json
          data=json.load(open('security-result.json', encoding='utf-8'))
          assert data['status'] == 'failed'
          assert any(f['severity'] == 'high' for f in data['findings'])
          print('AI-Agent-Manager SecurityAgent integration test passed.')
          PY

  executor:
    name: 🤖 اجرای Plan ChatGPT + AI-Agent-Manager Security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: دریافت مخزن Agent
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: دریافت نسخه پایدار Security Agent
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch security-agent-release "https://github.com/mydsoftware/AI-Agent-Manager.git" ai-agent-manager

      - name: تعیین Repository مقصد
        id: target
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository }}
          TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            test -n "$TARGET_REPOSITORY" || { echo "target_repository در Dispatch وجود ندارد." >&2; exit 1; }
            BRANCH="${TARGET_BRANCH:-main}"
          else
            BRANCH="${GITHUB_REF_NAME}"
            echo "TARGET_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          fi
          echo "workspace=${GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
          echo "repository=${TARGET_REPOSITORY:-$GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: دریافت Plan از ChatGPT
        id: task
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TASK="$WORKFLOW_TASK"
          elif [ "$EVENT_NAME" = "issues" ]; then
            TASK="$ISSUE_BODY"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python - <<'PY'
          import json, os
          payload = json.loads(os.environ["DISPATCH_PAYLOAD"])
          plan = payload.get("plan")
          if not isinstance(plan, dict):
              raise SystemExit("Dispatch باید plan JSON داشته باشد.")
          with open("agent/chatgpt_plan.json", "w", encoding="utf-8") as f:
              json.dump(plan, f, ensure_ascii=False, indent=2)
          print(json.dumps({"summary": plan.get("summary", ""), "files": len(plan.get("files", [])), "commands": len(plan.get("commands", []))}, ensure_ascii=False))
          PY
            exit 0
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^chat_requests/.*\.json$' | tail -n 1 || true)
            test -n "$REQUEST_FILE" || REQUEST_FILE=$(find chat_requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)
            test -n "$REQUEST_FILE"
            TASK=$(cat "$REQUEST_FILE")
          fi
          test -n "$(printf '%s' "$TASK" | tr -d '[:space:]')"
          printf '%s\n' "$TASK" > agent/chatgpt_plan.json

      - name: اجرای Build → Test → AI-Agent-Manager Security
        env:
          AGENT_PLAN: ${{ github.workspace }}/agent/chatgpt_plan.json
          AGENT_WORKSPACE: ${{ steps.target.outputs.workspace }}
          AGENT_RESULT: ${{ github.workspace }}/agent-result.json
          SECURITY_RESULT: ${{ github.workspace }}/security-result.json
          AI_MANAGER_ROOT: ${{ github.workspace }}/ai-agent-manager
        shell: bash
        run: |
          set -euo pipefail
          python agent/planner.py
          python agent/executor.py
          python ai-agent-manager/manager_security.py

      - name: ثبت نتیجه
        if: always()
        shell: bash
        run: |
          mkdir -p agent-results
          cp -f agent-result.json agent-results/agent-result.json 2>/dev/null || true
          cp -f agent/chatgpt_plan.json agent-results/chatgpt_plan.json 2>/dev/null || true
          cp -f security-result.json agent-results/security-result.json 2>/dev/null || true
          if [ -f agent-results/agent-result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("agent-results/agent-result.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({"success": d.get("success"), "summary": d.get("summary"), "error": d.get("error")}, ensure_ascii=False))
          PY
          fi

      - name: ثبت تغییرات Repository مقصد
        if: success() && github.event_name == 'repository_dispatch'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "تغییری برای ثبت وجود ندارد."
            exit 0
          fi
          git commit -m "feat: build project via AI-Agent-Manager"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: گزارش اجرا
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-Agent-${{ github.run_number }}
          path: agent-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: ثبت خلاصه نتیجه در Repository Agent
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p agent-results
          git add agent-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record ChatGPT agent result"
          git push origin HEAD:main

  deploy:
    name: 🚀 Deploy پس از Security Gate
    needs: executor
    if: needs.executor.result == 'success' && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت نسخه تأییدشده
        uses: actions/checkout@v6
      - name: بررسی سایت
        shell: bash
        run: test -f site/index.html
      - name: آماده‌سازی GitHub Pages
        uses: actions/configure-pages@v5
      - name: بسته‌بندی سایت برای Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: انتشار سایت
        id: deployment
        uses: actions/deploy-pages@v4
      - name: نمایش آدرس سایت
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "$SITE_URL"
