name: اجرای عامل متصل به ChatGPT

on:
  push:
    paths: ["chat_requests/*.json"]
  repository_dispatch:
    types: [ai-agent-project]
  workflow_dispatch:
    inputs:
      task:
        description: "Plan JSON تولیدشده توسط ChatGPT"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  executor:
    name: 🤖 اجرای Plan فارسی
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: دریافت کد عامل
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: آماده‌سازی Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: دریافت Executor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent
          curl -fsSL "https://raw.githubusercontent.com/mydsoftware/GitHub-Autonomous-Agent/main/agent/executor.py" -o agent/executor.py
          test -s agent/executor.py

      - name: تعیین Repository مقصد
        id: target
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository }}
          TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            test -n "$TARGET_REPOSITORY" || { echo "target_repository در Dispatch وجود ندارد." >&2; exit 1; }
            REPO="$TARGET_REPOSITORY"
            BRANCH="${TARGET_BRANCH:-main}"
            DIR="$RUNNER_TEMP/target-repository"
            git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$DIR"
          else
            REPO="$GITHUB_REPOSITORY"
            BRANCH="$GITHUB_REF_NAME"
            DIR="$GITHUB_WORKSPACE"
          fi
          test -d "$DIR/.git"
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "workspace=$DIR" >> "$GITHUB_OUTPUT"
          echo "Repository مقصد: $REPO"
          echo "شاخه مقصد: $BRANCH"

      - name: ساخت Plan فارسی
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          WORKFLOW_TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python - <<'PY'
          import json, os
          payload=json.loads(os.environ['DISPATCH_PAYLOAD'])
          plan=payload.get('plan')
          if not isinstance(plan,dict): raise SystemExit('Plan وجود ندارد.')
          if not isinstance(plan.get('files'),list) or not isinstance(plan.get('commands'),list) or plan.get('done') is not True:
              raise SystemExit('Plan باید files، commands و done=true داشته باشد.')
          with open('agent/chatgpt_plan.json','w',encoding='utf-8') as f: json.dump(plan,f,ensure_ascii=False,indent=2)
          PY
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$WORKFLOW_TASK" > agent/chatgpt_plan.json
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^chat_requests/.*\.json$' | tail -n 1 || true)
            test -n "$REQUEST_FILE" || REQUEST_FILE=$(find chat_requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)
            test -n "$REQUEST_FILE"
            cp "$REQUEST_FILE" agent/chatgpt_plan.json
          fi
          test -s agent/chatgpt_plan.json
          python -m json.tool agent/chatgpt_plan.json >/dev/null
          echo "Plan فارسی معتبر است."

      - name: آماده‌سازی Workspace مقصد
        env:
          TARGET_WORKSPACE: ${{ steps.target.outputs.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TARGET_WORKSPACE/agent"
          cp "$GITHUB_WORKSPACE/agent/executor.py" "$TARGET_WORKSPACE/agent/executor.py"
          cp "$GITHUB_WORKSPACE/agent/chatgpt_plan.json" "$TARGET_WORKSPACE/agent/chatgpt_plan.json"
          if [ -f "$GITHUB_WORKSPACE/security_check.py" ]; then cp "$GITHUB_WORKSPACE/security_check.py" "$TARGET_WORKSPACE/security_check.py"; fi
          test -s "$TARGET_WORKSPACE/agent/executor.py"
          test -s "$TARGET_WORKSPACE/agent/chatgpt_plan.json"
          python -m json.tool "$TARGET_WORKSPACE/agent/chatgpt_plan.json" >/dev/null
          echo "Workspace مقصد آماده است."

      - name: اجرای Executor و ثبت اجباری گزارش
        id: run_agent
        continue-on-error: true
        env:
          AGENT_PLAN: ${{ steps.target.outputs.workspace }}/agent/chatgpt_plan.json
          AGENT_WORKSPACE: ${{ steps.target.outputs.workspace }}
          AGENT_RESULT: ${{ github.workspace }}/agent-result.json
        shell: bash
        run: |
          set +e
          python "$AGENT_WORKSPACE/agent/executor.py" > "$GITHUB_WORKSPACE/executor-output.txt" 2>&1
          CODE=$?
          echo "$CODE" > "$GITHUB_WORKSPACE/executor-exit-code.txt"
          cp "$GITHUB_WORKSPACE/agent-result.json" "$AGENT_WORKSPACE/agent/agent-result.json" 2>/dev/null || true
          {
            echo "=== کد خروج Executor ==="
            echo "$CODE"
            echo "=== خروجی Executor ==="
            cat "$GITHUB_WORKSPACE/executor-output.txt"
            echo "=== نتیجه Executor ==="
            cat "$GITHUB_WORKSPACE/agent-result.json" 2>/dev/null || echo "agent-result.json تولید نشد."
          } > "$AGENT_WORKSPACE/agent/executor-debug.txt"
          exit "$CODE"

      - name: ثبت گزارش در Repository مقصد
        if: always() && github.event_name == 'repository_dispatch'
        env:
          TARGET_WORKSPACE: ${{ steps.target.outputs.workspace }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          cd "$TARGET_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "گزارشی برای Commit وجود ندارد."
            exit 0
          fi
          git commit -m "ثبت گزارش اجرای عامل خودکار"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"

      - name: نمایش گزارش Executor
        if: always()
        shell: bash
        run: |
          echo "=== کد خروج ==="
          cat executor-exit-code.txt 2>/dev/null || true
          echo "=== خروجی ==="
          cat executor-output.txt 2>/dev/null || true
          echo "=== نتیجه ==="
          cat agent-result.json 2>/dev/null || true

      - name: بررسی امنیتی
        if: steps.run_agent.outcome == 'success' && github.event_name != 'repository_dispatch'
        shell: bash
        run: |
          test -s security_check.py
          python security_check.py

      - name: آپلود گزارش
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-Agent-${{ github.run_number }}
          path: |
            agent-result.json
            executor-output.txt
            executor-exit-code.txt
            agent/chatgpt_plan.json
          if-no-files-found: ignore
          retention-days: 7

      - name: شکست نهایی در صورت شکست Executor
        if: steps.run_agent.outcome == 'failure'
        run: |
          echo "Executor شکست خورد؛ گزارش آن در Repository مقصد ثبت شده است."
          exit 1
