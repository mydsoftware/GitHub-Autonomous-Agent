name: اجرای عامل متصل به ChatGPT

on:
  push:
    paths:
      - "chat_requests/*.json"
  workflow_dispatch:
    inputs:
      task:
        description: "Plan JSON تولیدشده توسط ChatGPT"
        required: true
        type: string
  issues:
    types: [opened]
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: عامل-متصل-به-ChatGPT
  cancel-in-progress: false

jobs:
  integration:
    name: 🧪 تست اتصال Security Agent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: دریافت نسخه پایدار Security Agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo "Secret GH_PAT برای اتصال به AI-Agent-Manager تنظیم نشده است." >&2; exit 1; }
          git clone --depth 1 --branch security-agent-release "https://x-access-token:${GH_TOKEN}@github.com/mydsoftware/AI-Agent-Manager.git" ai-agent-manager
      - name: بررسی ساختار Python
        run: python -m py_compile agent/security_gate.py
      - name: آزمون Security Gate
        run: |
          mkdir -p site
          printf '%s\n' '<script>eval("x")</script>' > site/index.html
          if python agent/security_gate.py; then echo "Security Gate باید Finding را Block کند." >&2; exit 1; fi
          python - <<'PY'
          import json
          data=json.load(open('security-result.json', encoding='utf-8'))
          assert data['passed'] is False
          assert any(f['severity'] == 'high' for f in data['findings'])
          print('Security Gate integration test passed.')
          PY

  executor:
    name: 🤖 اجرای Plan ChatGPT + AI-Agent-Manager Security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: دریافت نسخه پایدار Security Agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo "Secret GH_PAT برای اتصال به AI-Agent-Manager تنظیم نشده است." >&2; exit 1; }
          git clone --depth 1 --branch security-agent-release "https://x-access-token:${GH_TOKEN}@github.com/mydsoftware/AI-Agent-Manager.git" ai-agent-manager
      - name: دریافت Plan از ChatGPT
        id: task
        env:
          WORKFLOW_TASK: ${{ inputs.task }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TASK="$WORKFLOW_TASK"
          elif [ "$EVENT_NAME" = "issues" ]; then
            TASK="$ISSUE_BODY"
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^chat_requests/.*\.json$' | tail -n 1 || true)
            test -n "$REQUEST_FILE" || REQUEST_FILE=$(find chat_requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)
            test -n "$REQUEST_FILE"
            TASK=$(cat "$REQUEST_FILE")
          fi
          test -n "$(printf '%s' "$TASK" | tr -d '[:space:]')"
          {
            echo "task<<EOF"
            printf '%s\n' "$TASK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: اجرای Build → Test → Security
        env:
          AGENT_TASK: ${{ steps.task.outputs.task }}
          AI_MANAGER_ROOT: ${{ github.workspace }}/ai-agent-manager
        shell: bash
        run: |
          set -euo pipefail
          python agent/planner.py
          python agent/executor.py
          python agent/security_gate.py
      - name: ثبت نتیجه
        if: always()
        shell: bash
        run: |
          mkdir -p agent-results
          cp -f agent-result.json agent-results/agent-result.json 2>/dev/null || true
          cp -f agent/chatgpt_plan.json agent-results/chatgpt_plan.json 2>/dev/null || true
          cp -f security-result.json agent-results/security-result.json 2>/dev/null || true
      - name: گزارش اجرا
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: گزارش-اجرای-Agent-${{ github.run_number }}
          path: agent-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: ثبت خلاصه نتیجه در Repository
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p agent-results
          git add agent-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record ChatGPT agent result"
          git push origin HEAD:main

  deploy:
    name: 🚀 Deploy پس از Security Gate
    needs: executor
    if: needs.executor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت نسخه تأییدشده
        uses: actions/checkout@v6
      - name: بررسی سایت
        shell: bash
        run: test -f site/index.html
      - name: آماده‌سازی GitHub Pages
        uses: actions/configure-pages@v5
      - name: بسته‌بندی سایت برای Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: انتشار سایت
        id: deployment
        uses: actions/deploy-pages@v4
      - name: نمایش آدرس سایت
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "$SITE_URL"
