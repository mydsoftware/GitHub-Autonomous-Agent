name: اجرای عامل متصل به ChatGPT

on:
  push:
    paths: ["chat_requests/*.json"]
  repository_dispatch:
    types: [ai-agent-project]
  workflow_dispatch:
    inputs:
      task:
        description: "Plan JSON تولیدشده توسط ChatGPT"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  executor:
    name: 🤖 اجرای Plan فارسی
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: دریافت Repository مقصد
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ثبت Boot Diagnostic
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics agent
          {
            echo "Agent boot OK"
            echo "run=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "repository=$GITHUB_REPOSITORY"
            echo "sha=$GITHUB_SHA"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > diagnostics/boot.txt

      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: دریافت Executor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent
          curl -fsSL "https://raw.githubusercontent.com/mydsoftware/GitHub-Autonomous-Agent/main/agent/executor.py" -o agent/executor.py
          test -s agent/executor.py

      - name: دریافت Plan از Dispatch
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          WORKFLOW_TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python - <<'PY'
          import json, os
          payload=json.loads(os.environ['DISPATCH_PAYLOAD'])
          plan=payload.get('plan')
          if not isinstance(plan,dict):
              raise SystemExit('Plan وجود ندارد.')
          if not isinstance(plan.get('files'),list) or not isinstance(plan.get('commands'),list) or plan.get('done') is not True:
              raise SystemExit('Plan باید files، commands و done=true داشته باشد.')
          with open('agent/chatgpt_plan.json','w',encoding='utf-8') as f:
              json.dump(plan,f,ensure_ascii=False,indent=2)
          PY
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$WORKFLOW_TASK" > agent/chatgpt_plan.json
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^chat_requests/.*\.json$' | tail -n 1 || true)
            test -n "$REQUEST_FILE" || REQUEST_FILE=$(find chat_requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)
            test -n "$REQUEST_FILE"
            cp "$REQUEST_FILE" agent/chatgpt_plan.json
          fi
          test -s agent/chatgpt_plan.json
          python -m json.tool agent/chatgpt_plan.json >/dev/null

      - name: اجرای Executor
        id: run_agent
        continue-on-error: true
        env:
          AGENT_PLAN: ${{ github.workspace }}/agent/chatgpt_plan.json
          AGENT_WORKSPACE: ${{ github.workspace }}
          AGENT_RESULT: ${{ github.workspace }}/agent-result.json
        shell: bash
        run: |
          set +e
          python "$AGENT_WORKSPACE/agent/executor.py" > executor-output.txt 2>&1
          CODE=$?
          echo "$CODE" > executor-exit-code.txt
          {
            echo "=== کد خروج Executor ==="
            echo "$CODE"
            echo "=== خروجی Executor ==="
            cat executor-output.txt
            echo "=== نتیجه Executor ==="
            cat agent-result.json 2>/dev/null || echo "agent-result.json تولید نشد."
          } > agent/executor-debug.txt
          exit "$CODE"

      - name: ثبت نتیجه مستقل
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p agent
          if [ ! -f agent-result.json ]; then
            printf '{"status":"agent-failed-before-result","run_id":"%s","event":"%s","timestamp":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > agent/failure.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ثبت گزارش اجرای Agent" >/tmp/agent-commit.log 2>&1
          COMMIT_CODE=$?
          git push origin "HEAD:${GITHUB_REF_NAME}" >/tmp/agent-push.log 2>&1
          PUSH_CODE=$?
          echo "commit_code=$COMMIT_CODE"
          echo "push_code=$PUSH_CODE"
          cat /tmp/agent-commit.log || true
          cat /tmp/agent-push.log || true

      - name: نمایش گزارش
        if: always()
        shell: bash
        run: |
          echo "=== خروج Executor ==="
          cat executor-exit-code.txt 2>/dev/null || true
          echo "=== گزارش ==="
          cat agent/executor-debug.txt 2>/dev/null || true
          cat agent/failure.json 2>/dev/null || true

      - name: آپلود گزارش
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: گزارش-Agent-${{ github.run_number }}
          path: |
            diagnostics/
            agent/
            agent-result.json
            executor-output.txt
            executor-exit-code.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: شکست نهایی در صورت شکست Executor
        if: steps.run_agent.outcome == 'failure'
        run: |
          echo "Executor شکست خورد؛ گزارش در Repository ثبت شده است."
          exit 1
